name: Pipeline de Dados

on:
  schedule:
    # TEMPORÁRIO PARA TESTE: executa a cada 5 minutos.
    # Depois de validar no app, voltar para "0 10 * * *".
    - cron: "*/5 * * * *"
  workflow_dispatch:
    # Permite disparo manual pela aba Actions do GitHub
    inputs:
      force:
        description: "Forçar atualização (ignorar controle de frequência)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  update:
    name: Atualizar fontes de dados
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      APP_ENV: production
      MOCK_MODE: "false"
      PYTHONUNBUFFERED: "1"
      SUPABASE_UNIFICADO_URL: ${{ secrets.SUPABASE_UNIFICADO_URL }}
      DATABASE_URL:           ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_URL:        ${{ secrets.SUPABASE_DB_URL }}
      SOURCE_DB_APP1:         ${{ secrets.SOURCE_DB_APP1 }}
      OWNER_USER_ID:          ${{ secrets.OWNER_USER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt

      - name: Validar configuração do Supabase
        run: |
          if [ -z "${SUPABASE_UNIFICADO_URL}${DATABASE_URL}${SUPABASE_DB_URL}" ]; then
            echo "ERRO: configure SUPABASE_UNIFICADO_URL em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Inicializar tabelas do pipeline
        run: |
          python - <<'PY'
          from data_pipeline.utils.db_utils import ensure_pipeline_tables
          result = ensure_pipeline_tables()
          print(result)
          if not result.get("ok"):
              raise SystemExit(1)
          PY

      - name: Executar pipeline
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python run_data_updates.py --all --force --json
          else
            python run_data_updates.py --all --json
          fi

      - name: Resumo do resultado
        if: always()
        run: python run_data_updates.py --status --json || true
