name: Pipeline de Dados

on:
  schedule:
    # Único workflow do pipeline de dados (absorveu o antigo update-data.yml).
    # Dois horários, isolados dos demais jobs para evitar escrita concorrente
    # no compute Nano (Free): bootstrap 06:00, market-refresh 09:00
    # (+ anual sáb 08:00). Os jobs "diario" rodam uma vez por data de Brasília
    # (should_run_job), então o segundo disparo só executa o que o primeiro
    # não concluiu: funciona como nova tentativa, não como carga dobrada.
    # O GitHub costuma atrasar o cron em horas; quem chegar primeiro no dia
    # faz o trabalho.
    - cron: "0 12 * * *"     # 09:00 BRT
    - cron: "30 21 * * *"    # 18:30 BRT
  workflow_dispatch:
    # Permite disparo manual pela aba Actions do GitHub
    inputs:
      force:
        description: "Forçar atualização (ignorar controle de frequência)"
        type: boolean
        default: false
      source:
        description: "Job específico (ex.: update_bcb) ou all"
        required: false
        default: "all"
        type: string

permissions:
  contents: read

# Nunca duas execuções ao mesmo tempo contra o Supabase; a segunda espera.
concurrency:
  group: pipeline-de-dados
  cancel-in-progress: false

jobs:
  update:
    name: Atualizar fontes de dados
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      APP_ENV: production
      MOCK_MODE: "false"
      PYTHONUNBUFFERED: "1"
      DATABASE_URL:           ${{ secrets.DATABASE_URL }}
      # Token da API brapi.dev (backfill histórico de DY). Free: 15k req/mês.
      BRAPI_TOKEN:            ${{ secrets.BRAPI_TOKEN }}
      # Auditoria & saneamento: "false" = dry-run (apenas propõe + relatório).
      # Defina o Secret/variable AUDIT_HEAL_APPLY como "true" para gravar correções.
      AUDIT_HEAL_APPLY:       ${{ vars.AUDIT_HEAL_APPLY || 'false' }}
      AUDIT_HEAL_BATCH:       ${{ vars.AUDIT_HEAL_BATCH || '50' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt

      - name: Validar configuração do Supabase
        run: |
          DB_URL="${DATABASE_URL}"
          if [ -z "$DB_URL" ]; then
            echo "ERRO: configure o secret DATABASE_URL em Settings > Secrets and variables > Actions."
            exit 1
          fi
          case "$DB_URL" in
            postgresql://*|postgres://*)
              echo "URL PostgreSQL do Supabase encontrada."
              ;;
            http://*|https://*)
              echo "ERRO: o Secret parece ser a URL pública do projeto Supabase."
              echo "Use a connection string do banco PostgreSQL, iniciando com postgresql:// ou postgres://."
              exit 1
              ;;
            *)
              echo "ERRO: DATABASE_URL não está em formato SQLAlchemy/PostgreSQL válido."
              echo "O valor deve iniciar com postgresql:// ou postgres://."
              exit 1
              ;;
          esac

      - name: Inicializar tabelas do pipeline
        run: |
          python - <<'PY'
          from data_pipeline.utils.db_utils import ensure_pipeline_tables
          result = ensure_pipeline_tables()
          print(result)
          if not result.get("ok"):
              raise SystemExit(1)
          PY

      - name: Executar pipeline
        env:
          # Entradas passam por env, nunca interpoladas no script (evita injeção).
          INPUT_FORCE: ${{ github.event.inputs.force || 'false' }}
          INPUT_SOURCE: ${{ github.event.inputs.source || 'all' }}
        run: |
          ARGS=(--json)
          if [ -z "$INPUT_SOURCE" ] || [ "$INPUT_SOURCE" = "all" ]; then
            ARGS+=(--all)
          elif [[ "$INPUT_SOURCE" =~ ^[a-z0-9_]+$ ]]; then
            ARGS+=(--source "$INPUT_SOURCE")
          else
            echo "ERRO: 'source' inválido: use o nome de um job (letras minúsculas, números e _) ou all."
            exit 1
          fi
          if [ "$INPUT_FORCE" = "true" ]; then
            ARGS+=(--force)
          fi
          echo "Executando: python run_data_updates.py ${ARGS[*]}"
          python run_data_updates.py "${ARGS[@]}"

      - name: Resumo do resultado
        if: always()
        run: python run_data_updates.py --status --json || true

      - name: Publicar relatórios de qualidade (auditoria/saneamento)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-reports
          path: artifacts/quality/
          if-no-files-found: ignore
          retention-days: 90
