name: Pipeline de Dados

on:
  schedule:
    # Executa todo dia às 18:30 horário de Brasília (21:30 UTC).
    - cron: "30 21 * * *"
  workflow_dispatch:
    # Permite disparo manual pela aba Actions do GitHub
    inputs:
      force:
        description: "Forçar atualização (ignorar controle de frequência)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  update:
    name: Atualizar fontes de dados
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      APP_ENV: production
      MOCK_MODE: "false"
      PYTHONUNBUFFERED: "1"
      SUPABASE_UNIFICADO_URL: ${{ secrets.SUPABASE_UNIFICADO_URL }}
      DATABASE_URL:           ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_URL:        ${{ secrets.SUPABASE_DB_URL }}
      SOURCE_DB_APP1:         ${{ secrets.SOURCE_DB_APP1 }}
      OWNER_USER_ID:          ${{ secrets.OWNER_USER_ID }}
      # Auditoria & saneamento: "false" = dry-run (apenas propõe + relatório).
      # Defina o Secret/variable AUDIT_HEAL_APPLY como "true" para gravar correções.
      AUDIT_HEAL_APPLY:       ${{ vars.AUDIT_HEAL_APPLY || 'false' }}
      AUDIT_HEAL_BATCH:       ${{ vars.AUDIT_HEAL_BATCH || '50' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt

      - name: Validar configuração do Supabase
        run: |
          DB_URL="${SUPABASE_UNIFICADO_URL:-${DATABASE_URL:-${SUPABASE_DB_URL}}}"
          if [ -z "$DB_URL" ]; then
            echo "ERRO: configure SUPABASE_UNIFICADO_URL em Settings > Secrets and variables > Actions."
            exit 1
          fi
          case "$DB_URL" in
            postgresql://*|postgres://*)
              echo "URL PostgreSQL do Supabase encontrada."
              ;;
            http://*|https://*)
              echo "ERRO: o Secret parece ser a URL pública do projeto Supabase."
              echo "Use a connection string do banco PostgreSQL, iniciando com postgresql:// ou postgres://."
              exit 1
              ;;
            *)
              echo "ERRO: SUPABASE_UNIFICADO_URL não está em formato SQLAlchemy/PostgreSQL válido."
              echo "O valor deve iniciar com postgresql:// ou postgres://."
              exit 1
              ;;
          esac

      - name: Inicializar tabelas do pipeline
        run: |
          python - <<'PY'
          from data_pipeline.utils.db_utils import ensure_pipeline_tables
          result = ensure_pipeline_tables()
          print(result)
          if not result.get("ok"):
              raise SystemExit(1)
          PY

      - name: Executar pipeline
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python run_data_updates.py --all --force --json
          else
            python run_data_updates.py --all --json
          fi

      - name: Resumo do resultado
        if: always()
        run: python run_data_updates.py --status --json || true

      - name: Publicar relatórios de qualidade (auditoria/saneamento)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-reports
          path: artifacts/quality/
          if-no-files-found: ignore
          retention-days: 90
