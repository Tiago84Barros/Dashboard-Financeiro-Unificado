name: Lacunas para o corretor na nuvem

# Ponte entre app_lacunas (Supabase) e o corretor que roda numa sessão do Claude
# Code na nuvem (core/lacunas/nuvem.py). A sessão não alcança o Postgres; o
# Actions alcança. Duas etapas, nesta ordem:
#   aplicar  -> docs/lacunas/decisoes_nuvem.jsonl volta para app_lacunas
#   exportar -> a fila, CIFRADA, no log (o repositório é público e a fila cita
#               ativos da carteira; a chave é LACUNAS_FILA_CHAVE)
# A sessão na nuvem baixa o log pela API pública e decifra com a mesma chave.
on:
  schedule:
    # 06:23 de Brasília, antes da tarefa agendada na nuvem (07:4x).
    - cron: "23 9 * * *"
  push:
    branches: [main]
    paths:
      - docs/lacunas/decisoes_nuvem.jsonl
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: lacunas-nuvem
  cancel-in-progress: false

jobs:
  fila:
    name: fila cifrada
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"
      SUPABASE_UNIFICADO_URL: ${{ secrets.SUPABASE_UNIFICADO_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      LACUNAS_FILA_CHAVE: ${{ secrets.LACUNAS_FILA_CHAVE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Conferir segredos
        run: |
          if [ -z "${SUPABASE_UNIFICADO_URL}${DATABASE_URL}${SUPABASE_DB_URL}" ]; then
            echo "ERRO: configure SUPABASE_UNIFICADO_URL nos GitHub Actions Secrets."
            exit 1
          fi
          if [ -z "${LACUNAS_FILA_CHAVE}" ]; then
            echo "ERRO: configure LACUNAS_FILA_CHAVE nos GitHub Actions Secrets (o mesmo valor vai no ambiente de nuvem do Claude Code)."
            exit 1
          fi

      - name: Aplicar decisões da nuvem em app_lacunas
        run: python scripts/lacunas_nuvem.py aplicar

      - name: Exportar a fila cifrada
        run: python scripts/lacunas_nuvem.py exportar
