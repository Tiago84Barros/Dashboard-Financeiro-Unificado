name: Market refresh (BRAPI Pro)

# Atualizacao leve e independente: Empresas B3 nao depende do schema de FIIs.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "O que rodar"
        type: choice
        options: ["schema", "daily", "annual", "both"]
        default: "daily"
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 8 * * 6"

permissions:
  contents: read

concurrency:
  group: market-refresh
  cancel-in-progress: false

jobs:
  refresh-b3:
    name: Atualizacao Empresas B3
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP_ENV: production
      PYTHONUNBUFFERED: "1"
      SUPABASE_UNIFICADO_URL: ${{ secrets.SUPABASE_UNIFICADO_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      OWNER_USER_ID: ${{ secrets.OWNER_USER_ID }}
      BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
      MARKET_DELAY: "1.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt
      - name: Confirmar token sem expor
        run: |
          python - <<'PY'
          import core.brapi as b
          assert b._token(), "BRAPI_TOKEN ausente"
          print("BRAPI_TOKEN ok | len:", len(b._token()))
          PY
      - name: Definir modo
        id: mode
        run: |
          M="${{ github.event.inputs.mode }}"
          if [ -z "$M" ]; then
            if [ "${{ github.event.schedule }}" = "0 8 * * 6" ]; then M="annual"; else M="daily"; fi
          fi
          echo "mode=$M" >> "$GITHUB_OUTPUT"
      - name: Garantir schema B3 auditavel
        if: steps.mode.outputs.mode != 'schema'
        run: python -m scripts.apply_b3_schema
      - name: Daily B3
        if: steps.mode.outputs.mode == 'daily' || steps.mode.outputs.mode == 'both'
        run: python run_market_ingest.py daily --source market --json
      - name: Annual B3
        if: steps.mode.outputs.mode == 'annual' || steps.mode.outputs.mode == 'both'
        run: python run_market_ingest.py annual --source market --json
      - name: Taxonomia B3
        if: steps.mode.outputs.mode == 'daily' || steps.mode.outputs.mode == 'both'
        run: python run_market_ingest.py setores --json
      - name: Snapshot de prontidao B3
        if: steps.mode.outputs.mode != 'schema'
        run: python -m scripts.snapshot_b3_readiness

  refresh-fiis:
    name: Atualizacao FIIs
    needs: refresh-b3
    if: always() && needs.refresh-b3.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP_ENV: production
      PYTHONUNBUFFERED: "1"
      SUPABASE_UNIFICADO_URL: ${{ secrets.SUPABASE_UNIFICADO_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      OWNER_USER_ID: ${{ secrets.OWNER_USER_ID }}
      BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
      MARKET_DELAY: "1.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt
      - name: Definir modo
        id: mode
        run: |
          M="${{ github.event.inputs.mode }}"
          if [ -z "$M" ]; then
            if [ "${{ github.event.schedule }}" = "0 8 * * 6" ]; then M="annual"; else M="daily"; fi
          fi
          echo "mode=$M" >> "$GITHUB_OUTPUT"
      # As etapas de CVM (fiis-cvm, fiis-entities, fiis-confidence, fiis-series),
      # o monitoramento e o `apply_fii_schema` SAIRAM daqui em 01/09/2026 e
      # rodam agora em `scripts/atualizar_vitrines.py`, na maquina local.
      #
      # Nao foi arrumar o que quebrou: elas nao podiam funcionar aqui. Das 22
      # tabelas `market.fii*`, 18 existem so no armazem local depois da migracao
      # local-first -- `fii_source_releases`, `fii_metric_observations`,
      # `fii_parser_calibrations` e companhia. O job falhava em dez execucoes
      # diarias seguidas sempre no mesmo ponto, e o `apply_fii_schema` teria sido
      # pior se tivesse dado certo: recriaria no Supabase justamente as tabelas
      # que a migracao tirou de la.
      #
      # Ficaram aqui as duas etapas que escrevem tabelas que o app le no
      # Supabase (`market.fiis`, benchmark IFIX) e que nao dependem do armazem.
      # Ficam remotas de proposito: rodam mesmo com o computador do usuario
      # desligado.
      - name: Ranking FIIs
        if: steps.mode.outputs.mode == 'daily' || steps.mode.outputs.mode == 'both'
        run: python run_market_ingest.py fiis --json
      - name: Benchmark IFIX
        if: steps.mode.outputs.mode == 'daily' || steps.mode.outputs.mode == 'both'
        run: python run_market_ingest.py benchmark --json
