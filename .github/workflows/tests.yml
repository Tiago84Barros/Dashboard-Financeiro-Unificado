name: Testes

# Guarda de regressão da suíte (784 testes). A auditoria percentual de
# 2026-07 apontou que nenhum workflow executava pytest: as correções de
# qualidade de dados e as guardas de ingestão dependiam de execução manual.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Um PR que recebe vários pushes cancela as execuções antigas.
concurrency:
  group: testes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # 3.11 espelha os workflows de dados; 3.12 é o ambiente de dev local.
        python-version: ["3.11", "3.12"]

    env:
      # Sem banco e sem chaves: a suíte é offline por construção. Qualquer
      # teste que precise de rede deve isolar-se com fixture/monkeypatch.
      APP_ENV: test
      MOCK_MODE: "true"
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historico completo: tests/test_lacunas_guarda.py compara o branch
          # com origin/main e falha, de proposito, se a base nao existir.
          fetch-depth: 0

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest

      - name: Rodar a suíte
        env:
          # Lido pela guarda de lacunas: uma secao "## Aviso removido" no corpo
          # do PR libera a remocao justificada de um aviso. Vai por env, nunca
          # interpolado no script, porque o corpo e texto livre.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python -m pytest tests -q --durations=10

      - name: Verificar lint
        run: python -m ruff check .
