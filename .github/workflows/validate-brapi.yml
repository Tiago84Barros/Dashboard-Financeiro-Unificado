name: Validação BRAPI (controlada)

# Validação controlada da BRAPI — NÃO faz bootstrap completo.
# Usa o Secret BRAPI_TOKEN (nunca impresso), garante o schema market.* e
# valida poucos tickers, salvando raw + normalizado e gerando relatório.
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers (separados por espaço)"
        type: string
        default: "PETR4 ITUB4 WEGE3"

permissions:
  contents: read

jobs:
  validate:
    name: Validar BRAPI (3 tickers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: production
      PYTHONUNBUFFERED: "1"
      SUPABASE_UNIFICADO_URL: ${{ secrets.SUPABASE_UNIFICADO_URL }}
      DATABASE_URL:           ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_URL:        ${{ secrets.SUPABASE_DB_URL }}
      OWNER_USER_ID:          ${{ secrets.OWNER_USER_ID }}
      BRAPI_TOKEN:            ${{ secrets.BRAPI_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt

      - name: Confirmar token carregado (sem expor)
        run: |
          python - <<'PY'
          import core.brapi as b
          tok = b._token()
          print("BRAPI_TOKEN carregado:", bool(tok), "| len:", (len(tok) if tok else 0))
          assert tok, "BRAPI_TOKEN ausente — configure o Secret."
          PY

      - name: Garantir schema market.* (013, idempotente)
        run: |
          python - <<'PY'
          from data_pipeline.utils.db_utils import get_pipeline_engine
          eng = get_pipeline_engine()
          assert eng is not None, "Banco não conectado"
          sql = open("supabase_unificado/schema/013_market_brapi_schema.sql", encoding="utf-8").read()
          raw = eng.raw_connection()
          try:
              cur = raw.cursor(); cur.execute(sql); raw.commit()
              print("schema market.* garantido (CREATE IF NOT EXISTS).")
          finally:
              raw.close()
          PY

      - name: Validação controlada (sem bootstrap)
        run: python run_market_ingest.py validate --tickers ${{ github.event.inputs.tickers }} --json
